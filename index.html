<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pro Image Processor - WebP Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- সাইডবার - Canva স্টাইল -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-crop-alt"></i>
                <span>Image<span class="highlight">Pro</span></span>
            </div>
            
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>Upload Images</h3>
                <p>Drag & drop or click to browse</p>
                <input type="file" id="fileInput" multiple accept="image/jpeg,image/jpg,image/png,image/webp,image/bmp,image/tiff,image/gif">
                <button class="upload-btn" id="uploadBtn">
                    <i class="fas fa-folder-open"></i> Browse Files
                </button>
                <div class="supported-formats">
                    <span>JPG</span> <span>PNG</span> <span>WebP</span> <span>BMP</span> <span>TIFF</span> <span>GIF</span>
                </div>
            </div>
            
            <div class="stats-panel" id="statsPanel" style="display: none;">
                <div class="stat-item">
                    <i class="fas fa-images"></i>
                    <span id="totalImages">0</span>
                    <small>Images</small>
                </div>
                <div class="stat-item">
                    <i class="fas fa-check-circle"></i>
                    <span id="processedCount">0</span>
                    <small>Processed</small>
                </div>
                <div class="stat-item">
                    <i class="fas fa-download"></i>
                    <span id="totalOutputs">0</span>
                    <small>Outputs</small>
                </div>
            </div>
            
            <div class="action-buttons" id="actionButtons" style="display: none;">
                <button class="btn-download-all" id="downloadAllBtn">
                    <i class="fas fa-download"></i> Download All (ZIP)
                </button>
                <button class="btn-clear" id="clearAllBtn">
                    <i class="fas fa-trash-alt"></i> Clear All
                </button>
            </div>
        </aside>
        
        <!-- মেইন কন্টেন্ট এরিয়া -->
        <main class="main-content">
            <div class="header">
                <h1>
                    <i class="fas fa-magic"></i> 
                    Image Processing Studio
                </h1>
                <p class="subtitle">Center crop to 1:1 (Square) & 4:3 (Landscape) • WebP Export</p>
            </div>
            
            <!-- প্রগ্রেস বার -->
            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-header">
                    <span><i class="fas fa-spinner fa-pulse"></i> Processing images...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-status" id="progressStatus"></div>
            </div>
            
            <!-- ইমেজ গ্যালারি -->
            <div class="gallery-container" id="galleryContainer">
                <div class="empty-state">
                    <i class="fas fa-images"></i>
                    <h3>No images yet</h3>
                    <p>Upload images from the sidebar to start processing</p>
                </div>
            </div>
        </main>
    </div>
    
    <!-- টোস্ট নোটিফিকেশন -->
    <div id="toast" class="toast"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="script.js"></script>
</body>
  </html>
